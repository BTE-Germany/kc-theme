name: ci

on:
    push:
        branches:
            - "**"
    pull_request:
        branches:
            - main
    workflow_dispatch:

# Only the latest run per branch/PR matters; cancel superseded ones.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: Build theme
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            # Uses the pnpm version pinned in package.json ("packageManager").
            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            # Keycloakify packages the theme with Maven, which needs a JDK.
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 21

            - name: Check Maven
              run: mvn --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm exec eslint src

            - name: Check formatting
              run: pnpm exec prettier --check "src/**/*.{ts,tsx,css}"

            - name: Build Keycloak theme
              run: pnpm build-keycloak-theme

            - name: Upload theme jars
              uses: actions/upload-artifact@v7
              with:
                  name: keycloak-theme
                  path: dist_keycloak/keycloak-theme-*.jar
                  if-no-files-found: error

    release:
        name: Publish release
        # A release is published when a push to main changes the version in package.json.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  fetch-tags: true

            - name: Check whether the version changed
              id: version
              env:
                  BEFORE: ${{ github.event.before }}
              run: |
                  version="$(node -p "require('./package.json').version")"
                  previous="$(git show "$BEFORE:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || true)"
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  if [ "$version" != "$previous" ] && ! git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
                      echo "release=true" >> "$GITHUB_OUTPUT"
                      echo "Releasing v$version (previous: ${previous:-none})"
                  else
                      echo "release=false" >> "$GITHUB_OUTPUT"
                      echo "Version $version unchanged or already released; skipping"
                  fi

            - name: Download theme jars
              if: steps.version.outputs.release == 'true'
              uses: actions/download-artifact@v8
              with:
                  name: keycloak-theme
                  path: dist_keycloak

            - name: Create GitHub release
              if: steps.version.outputs.release == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  prerelease=""
                  case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
                  gh release create "v$VERSION" dist_keycloak/keycloak-theme-*.jar \
                      --title "Release v$VERSION" \
                      --target "$GITHUB_SHA" \
                      --generate-notes \
                      $prerelease
